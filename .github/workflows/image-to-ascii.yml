name: Image-to-vision bridge

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: "Public HTTPS URL of the image to inspect"
        required: true
        type: string
        default: "https://raw.githubusercontent.com/JasonScottCManalo12/Business-Startup/main/Screenshot_2026-10-23-15-50-12-32.jpg"
      preview_width:
        description: "Preview width in pixels (32–1024)"
        required: true
        type: string
        default: "324"
  push:
    paths:
      - "tools/image_to_ascii.py"
      - ".github/workflows/image-to-ascii.yml"

permissions:
  contents: read

jobs:
  image-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      IMAGE_URL: ${{ inputs.image_url || 'https://raw.githubusercontent.com/JasonScottCManalo12/Business-Startup/main/Screenshot_2026-10-23-15-50-12-32.jpg' }}
      PREVIEW_WIDTH: ${{ inputs.preview_width || '324' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Download image and create preview
        run: python tools/image_to_ascii.py
      - name: Upload bridge output
        uses: actions/upload-artifact@v4
        with:
          name: image-bridge-output
          path: |
            image-preview.png
            image-ascii.txt
            image-metadata.json
