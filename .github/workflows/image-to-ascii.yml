name: JPEG to ASCII interpreter test

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/image_to_ascii.py"
      - ".github/workflows/image-to-ascii.yml"

permissions:
  contents: read

jobs:
  image-to-ascii:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Download, decode, and render preview
        run: python tools/image_to_ascii.py
      - name: Upload image previews
        uses: actions/upload-artifact@v4
        with:
          name: image-bridge-previews
          path: |
            image-ascii.txt
            image-preview.png
