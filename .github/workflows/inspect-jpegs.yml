name: Inspect repository JPEGs

on:
  workflow_dispatch:
  push:
    paths:
      - "random-image-3840x2160.jpg"
      - "random-image-1920x1080.jpg"
      - "random-image-1280x720.jpg"
      - "random-image-1080x8000.jpg"
      - "tools/inspect_images.py"
      - ".github/workflows/inspect-jpegs.yml"

permissions:
  contents: read

jobs:
  inspect-jpegs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image inspection dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Inspect raw GitHub-hosted JPEGs
        run: python tools/inspect_images.py

      - name: Upload machine-readable results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jpeg-inspection-results
          path: jpeg-inspection-results.json
          if-no-files-found: ignore
